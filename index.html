<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股市看板</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-root: #080c12;
            --bg-card: #0e1520;
            --bg-section: #121c2a;
            --bg-input: #1a2740;
            --bg-grid: #162036;
            --border: #1f3050;
            --border-accent: #2a4878;
            --text-primary: #e8f0fe;
            --text-secondary:#7a9cc4;
            --text-muted: #3d5a80;
            --up: #ff4d6d;
            --down: #00d68f;
            --up-bg: rgba(255,77,109,0.12);
            --down-bg: rgba(0,214,143,0.12);
            --accent-blue: #4d9fff;
            --accent-gold: #f59e0b;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            font-family:'Noto Sans TC',sans-serif;
            background-color:var(--bg-root);
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(30,60,120,0.25) 0%,transparent 60%),
                radial-gradient(ellipse at 80% 100%,rgba(10,40,80,0.30) 0%,transparent 60%);
            color:var(--text-primary);
            min-height:100vh; padding:28px 16px;
            display:flex; flex-direction:column; align-items:center;
        }
        .container { width:100%; max-width:920px; }
        
        /* ── Header ── */
        .header-section {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:20px; padding-bottom:18px;
            border-bottom:1px solid var(--border-accent);
        }
        .header-left { display:flex; align-items:center; gap:12px; }
        .header-icon {
            width:40px; height:40px;
            background:linear-gradient(135deg,#1a4a8a,#2a7fff);
            border-radius:10px; display:flex; align-items:center; justify-content:center;
            font-size:20px; box-shadow:0 4px 16px rgba(45,127,255,0.35);
        }
        h2 { font-size:20px; font-weight:700; letter-spacing:0.02em; }
        .header-sub { color:var(--text-secondary); font-size:12px; margin-top:2px; }
        .header-right {
            display:flex; flex-direction:column; align-items:flex-end; gap:12px;
            width:100%; max-width:540px;
        }
        
        /* ── 新增股票與整理按鈕 ── */
        .add-stock-row { display:flex; gap:8px; width:100%; justify-content:flex-end; flex-wrap:wrap; }
        .add-stock-row input {
            background:var(--bg-input); border:1px solid var(--border-accent);
            color:var(--accent-blue); padding:9px 12px; border-radius:8px;
            font-family:'JetBrains Mono',monospace; font-size:13px;
        }
        .add-stock-row button {
            background:linear-gradient(135deg,#1a5fc8,#2d8fff); color:#fff; border:none; padding:9px 16px; border-radius:8px;
            cursor:pointer; font-weight:700; font-size:13px; transition:all 0.2s;
        }
        .add-stock-row button:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(45,127,255,0.3); }
        .btn-sort {
            background:transparent !important; color:var(--text-secondary) !important;
            border:1px solid var(--border-accent) !important; box-shadow:none !important;
        }
        .btn-sort:hover { background:var(--bg-section) !important; color:#fff !important; transform:none !important; }

        /* ── 操作動作列 ── */
        .sync-row { display: flex; gap: 12px; align-items: center; justify-content: flex-end; flex-wrap: wrap; width: 100%; }
        .data-mgmt { display:flex; gap:6px; align-items:center; }
        .data-mgmt button {
            background: var(--bg-section); border: 1px solid var(--border-accent);
            color: var(--text-secondary); padding: 9px 12px; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .data-mgmt button:hover { background: var(--bg-input); color: #fff; transform: translateY(-1px); }

        /* ── 狀態列 ── */
        #statusBar { display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-muted); transition:color 0.3s; }
        .dot { width:7px; height:7px; border-radius:50%; background:var(--text-muted); flex-shrink:0; transition:all 0.3s; }
        #statusBar.trading { color:#00d68f; } #statusBar.trading .dot { background:#00d68f; box-shadow:0 0 6px #00d68f; animation:pulse 1.5s infinite; }
        #statusBar.soon { color:var(--accent-blue); } #statusBar.soon .dot { background:var(--accent-blue); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .btn-update {
            background:linear-gradient(135deg,#1a5fc8,#2d8fff); color:#fff; border:none; padding:10px 20px; border-radius:8px;
            cursor:pointer; font-size:14px; font-weight:700; font-family:'Noto Sans TC',sans-serif; letter-spacing:0.03em;
            transition:all 0.2s; box-shadow:0 4px 16px rgba(45,143,255,0.3);
        }
        .btn-update:hover { transform:translateY(-1px); }
        .btn-update:disabled { background:#1a2740; color:var(--text-muted); cursor:not-allowed; box-shadow:none; transform:none; }
        
        /* ── 群組切換頁籤 (Tabs) ── */
        .group-tabs { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .group-tab {
            background: var(--bg-section); border: 1px solid var(--border-accent); color: var(--text-secondary); padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-weight: 700; font-size: 13px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .group-tab:hover { background: var(--bg-input); color: var(--text-primary); transform: translateY(-1px); }
        .group-tab.active { background: linear-gradient(135deg, #1a5fc8, #2d8fff); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(45, 127, 255, 0.3); }
        .group-tab.tab-portfolio { border-color:var(--accent-gold); color:var(--accent-gold); }
        .group-tab.tab-portfolio.active { background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); border-color: transparent; }

        /* ── 刪除按鈕 ── */
        .btn-delete {
            position:absolute; top:10px; right:10px; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#f87171; border-radius:6px; width:26px; height:26px;
            cursor:pointer; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; transition:all 0.2s; opacity:0; z-index: 10;
        }
        .card:hover .btn-delete, .port-card:hover .btn-delete { opacity:1; }
        .btn-delete:hover { background:rgba(239,68,68,0.35); color:#fff; }
        
        /* ── 分類標題 ── */
        .group-header { font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-secondary); margin:10px 0 14px; padding:5px 0 5px 10px; border-left:3px solid var(--border-accent); }
        
        /* ── Card (共用) ── */
        .card { background:var(--bg-card); border-radius:14px; border:1px solid var(--border-accent); border-left:4px solid var(--border-accent); margin-bottom:14px; overflow:hidden; position:relative; box-shadow:0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04); transition:border-left-color 0.35s; }
        .card.up-card { border-left-color:var(--up); } .card.down-card { border-left-color:var(--down); }
        .card-top { display:flex; justify-content:space-between; align-items:center; padding:18px 20px 14px; background:linear-gradient(180deg,rgba(30,60,100,0.3) 0%,transparent 100%); border-bottom:1px solid var(--border); }
        .stock-info { display:flex; flex-direction:column; gap:5px; }
        .stock-name { font-size:20px; font-weight:900; letter-spacing:0.04em; }
        .stock-symbol { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
        .symbol-label { background:var(--bg-input); border:1px solid var(--border-accent); border-radius:4px; padding:2px 7px; font-size:10px; color:var(--text-secondary); }
        .stock-symbol input { background:var(--bg-input); border:1px solid var(--border-accent); color:var(--accent-blue); font-size:12px; font-family:'JetBrains Mono',monospace; padding:3px 8px; border-radius:5px; }
        .stock-symbol input:focus { outline:none; border-color:var(--accent-blue); }
        
        /* ── Price ── */
        .price-info { text-align:right; }
        .current-price { font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; letter-spacing:-0.02em; line-height:1; }
        .current-price.up { color:var(--up); } .current-price.down { color:var(--down); }
        .price-change { font-family:'JetBrains Mono',monospace; font-size:13px; margin-top:5px; padding:3px 9px; border-radius:6px; display:inline-block; font-weight:600; }
        .price-change.up { background:var(--up-bg); color:var(--up); } .price-change.down { background:var(--down-bg); color:var(--down); }
        .vol-info { font-size:11px; color:var(--text-muted); margin-top:5px; } .vol-info span { color:var(--text-secondary); }
        .data-time { font-size:10px; color:var(--text-muted); margin-top:3px; font-family:'JetBrains Mono',monospace; } .data-time.stale { color:#e07b00; }
        .error-text { color:#ff9000 !important; font-size:14px !important; } .loading-text { color:var(--text-muted) !important; font-size:14px !important; }
        
        /* ── Chart ── */
        .chart-container { width:100%; height:100px; background:rgba(8,18,30,0.5); } .chart-container canvas { display:block; }
        
        /* ── Inputs ── */
        .calc-inputs { display:flex; flex-wrap:wrap; gap:14px; padding:16px 20px; background:var(--bg-section); border-top:1px solid var(--border); border-bottom:1px solid var(--border); align-items:flex-end; }
        .input-group { display:flex; flex-direction:column; gap:5px; } .input-group label { font-size:10px; color:var(--text-secondary); font-weight:600; letter-spacing:0.07em; text-transform:uppercase; }
        .input-group input { background:var(--bg-input); border:1px solid var(--border-accent); color:var(--text-primary); padding:7px 10px; border-radius:7px; font-size:14px; font-family:'JetBrains Mono',monospace; width:105px; text-align:center; font-weight:600; }
        .input-group input:focus { outline:none; border-color:var(--accent-blue); box-shadow:0 0 0 3px rgba(77,159,255,0.15); } .input-group input::placeholder { color:var(--text-muted); }
        .result-group { display:flex; flex-direction:column; gap:5px; margin-left:auto; text-align:right; } .result-group label { font-size:10px; color:var(--text-secondary); font-weight:600; letter-spacing:0.07em; text-transform:uppercase; }
        .result-val { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; } .up { color:var(--up) !important; } .down { color:var(--down) !important; }
        
        /* ── Grid ── */
        .grid-section { padding:14px 20px; } .grid-section + .grid-section { padding-top:4px; }
        .grid-title { font-size:10px; color:var(--text-secondary); font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
        .grid-title::after { content:''; flex:1; height:1px; background:var(--border); }
        .data-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:7px; } .data-grid-fib { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
        .grid-item { border-radius:8px; padding:9px 5px; text-align:center; transition:transform 0.15s; } .grid-item:hover { transform:translateY(-1px); }
        .item-label { font-size:10px; margin-bottom:4px; font-family:'JetBrains Mono',monospace; } .item-value { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; }
        .grid-item.drop-5  { background:rgba(56,189,248,.10);  border:1px solid rgba(56,189,248,.45);  border-left:3px solid #38bdf8; } .grid-item.drop-5  .item-label{color:#7dd3fc} .grid-item.drop-5  .item-value{color:#38bdf8}
        .grid-item.drop-10 { background:rgba(99,210,160,.10);  border:1px solid rgba(99,210,160,.45);  border-left:3px solid #63d2a0; } .grid-item.drop-10 .item-label{color:#9de8c4} .grid-item.drop-10 .item-value{color:#63d2a0}
        .grid-item.drop-15 { background:rgba(250,204,21,.10);  border:1px solid rgba(250,204,21,.45);  border-left:3px solid #facc15; } .grid-item.drop-15 .item-label{color:#fde68a} .grid-item.drop-15 .item-value{color:#facc15}
        .grid-item.drop-20 { background:rgba(251,146,60,.12);  border:1px solid rgba(251,146,60,.50);  border-left:3px solid #fb923c; } .grid-item.drop-20 .item-label{color:#fdba74} .grid-item.drop-20 .item-value{color:#fb923c}
        .grid-item.drop-25 { background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.50); border-left:3px solid #f87171; } .grid-item.drop-25 .item-label{color:#fca5a5} .grid-item.drop-25 .item-value{color:#f87171}
        .grid-item.drop-30 { background:rgba(239,68,68,.16);   border:1px solid rgba(239,68,68,.60);   border-left:3px solid #ef4444; } .grid-item.drop-30 .item-label{color:#fca5a5} .grid-item.drop-30 .item-value{color:#ef4444;font-size:14px}
        .grid-item.fib-236 { background:rgba(167,139,250,.10); border:1px solid rgba(167,139,250,.40); border-left:3px solid #a78bfa; } .grid-item.fib-236 .item-label{color:#c4b5fd} .grid-item.fib-236 .item-value{color:#a78bfa}
        .grid-item.fib-382 { background:rgba(139,92,246,.12);  border:1px solid rgba(139,92,246,.50);  border-left:3px solid #8b5cf6; } .grid-item.fib-382 .item-label{color:#c4b5fd} .grid-item.fib-382 .item-value{color:#8b5cf6}
        .grid-item.fib-500 { background:rgba(109,40,217,.16);  border:1px solid rgba(124,58,237,.55);  border-left:3px solid #7c3aed; } .grid-item.fib-500 .item-label{color:#c4b5fd} .grid-item.fib-500 .item-value{color:#c084fc}
        .grid-item.fib-618 { background:rgba(88,28,135,.22);   border:1px solid rgba(168,85,247,.65);  border-left:3px solid #a855f7; } .grid-item.fib-618 .item-label{color:#e9d5ff} .grid-item.fib-618 .item-value{color:#e879f9;font-size:14px}
        .grid-item.hit { outline:2px solid #facc15; outline-offset:-1px; }
        .hit-star { display:block; font-size:14px; line-height:1; margin-bottom:2px; color:#facc15; filter:drop-shadow(0 0 4px rgba(250,204,21,0.8)); }

        /* ── 持股專屬 UI (Portfolio) ── */
        .port-summary-box { background: linear-gradient(145deg, var(--bg-card) 0%, #162032 100%); border: 1px solid var(--border-accent); border-radius: 14px; padding: 24px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 30px; align-items: center; justify-content: space-around; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .port-metric { text-align: center; } .port-metric .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; letter-spacing: 0.05em; }
        .port-metric .val { font-size: 28px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
        .port-chart-container { width: 160px; height: 160px; position: relative; }
        
        .port-form-box { background: var(--bg-section); border: 1px dashed var(--border-accent); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
        .port-form-box input { background: var(--bg-input); border: 1px solid var(--border-accent); color: var(--accent-blue); padding: 9px 12px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; width: 130px; flex: 1; min-width: 100px; }
        .port-form-box button { background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff; border: none; padding: 9px 24px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); transition: transform 0.2s; white-space: nowrap; }
        .port-form-box button:hover { transform: translateY(-1px); }

        .port-card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-accent); margin-bottom: 12px; position: relative; overflow: hidden; border-left: 4px solid var(--accent-blue); }
        .port-card.up-card { border-left-color: var(--up); } .port-card.down-card { border-left-color: var(--down); }
        .port-card-inner { padding: 16px 20px; }
        .port-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .port-code { font-size: 20px; font-weight: 900; letter-spacing: 0.05em; }
        
        /* ✅ 將持股編輯區改成 6 欄 (包含配息與日期) */
        .port-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; text-align: center; }
        .port-grid > div { background: var(--bg-section); padding: 10px 5px; border-radius: 8px; border: 1px solid var(--border); display:flex; flex-direction:column; justify-content:center; }
        .port-grid .lbl { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
        .port-grid .val { font-size: 15px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        
        /* 針對持股卡片內的 input 修改樣式 */
        .port-grid input {
            background: transparent; border: 1px dashed var(--border-accent);
            color: var(--text-primary); text-align: center; width: 100%;
            font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700;
            border-radius: 4px; padding: 2px 0; transition: all 0.2s;
        }
        .port-grid input:focus, .port-grid input:hover { outline: none; border-color: var(--accent-gold); background: var(--bg-input); }
        /* 日期選擇器特別優化 */
        .port-grid input[type="date"] { font-size: 11px; padding: 3px 1px; letter-spacing: -0.5px; }
        .port-grid input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; cursor: pointer; }

        .port-footer { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        
        /* ── Footer ── */
        .footer-bar { display:flex; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; gap:10px; }
        .note { font-size:11px; color:var(--text-muted); }
        #proxyStatus { font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }

        @media (max-width:640px) {
            .data-grid { grid-template-columns:repeat(3,1fr); } .data-grid-fib { grid-template-columns:repeat(2,1fr); }
            .calc-inputs { gap:10px; } .input-group input { width:85px; font-size:13px; } .current-price { font-size:22px; }
            .card-top, .calc-inputs, .grid-section { padding:14px; }
            .port-summary-box { flex-direction: column; text-align: center; }
            .port-grid { grid-template-columns: repeat(3, 1fr); } /* 手機版變成 3 欄 2 列 */
            .header-right { align-items: flex-start; } .add-stock-row { justify-content: flex-start; } .sync-row { justify-content: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-section">
        <div class="header-left">
            <div class="header-icon">📈</div>
            <div>
                <h2>股市看板</h2>
                <div class="header-sub">即時報價 · 回檔目標 · 個人持股</div>
            </div>
        </div>
        <div class="header-right" id="header-right-controls">
            <div class="add-stock-row" id="normal-controls">
                <input id="newGroup" placeholder="群組名稱" value="📊 自選" style="width:105px;">
